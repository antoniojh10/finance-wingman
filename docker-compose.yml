services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Room for parallel `go test` packages and e2e runs across several
    # worktrees (the default 100 ran out).
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Optional local Grafana (collector + Tempo + Loki + Mimir): `make grafana`,
  # then open http://localhost:3300 and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  # Grafana listens on 3000 inside the container; it is mapped to 3300 so it
  # does not clash with `make web-dev`.
  grafana:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "${GRAFANA_UI_PORT:-3300}:3000"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - grafana-data:/data

volumes:
  postgres-data:
  grafana-data:
