version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node.js major the app runs on (Dockerfile, CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
