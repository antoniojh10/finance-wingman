name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs skip change detection and run every job.
  workflow_dispatch:
  # Nightly safety net: only e2e runs, against the tip of main.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

# A new push to a pull request cancels its previous run. Runs on main
# and scheduled runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects which apps changed so unaffected jobs are skipped. A change to
  # this workflow counts as a change to every app. Scheduled runs report no
  # changes: they only run e2e.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        with:
          filters: |
            api:
              - .github/workflows/ci.yml
              - apps/api/**
            web:
              - .github/workflows/ci.yml
              - apps/web/**

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DATABASE_URL: postgres://finance:finance@localhost:5432/finance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Tune Postgres for speed
        run: |
          # Service containers cannot take a command, so apply the
          # reloadable durability settings once the service is healthy.
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            psql "$PG_URL" -c "ALTER SYSTEM SET $setting"
          done
          psql "$PG_URL" -c "SELECT pg_reload_conf()"
          sleep 1
          test "$(psql "$PG_URL" -Atc "SHOW fsync")" = off
        env:
          PG_URL: postgres://finance:finance@localhost:5432/finance_test?sslmode=disable
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -count=1 ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Flows span both apps, so e2e runs when either changed, once the jobs
  # that did run have passed (a skipped api or web job does not block it).
  # It does not run on push to main: the pull request already ran it on the
  # same tree (branch protection requires up-to-date, green branches); the
  # nightly schedule covers main.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, api, web]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name != 'push' &&
      (github.event_name == 'schedule' ||
       needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - name: Tune Postgres for speed
        run: |
          # Service containers cannot take a command, so apply the
          # reloadable durability settings once the service is healthy.
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            psql "$PG_URL" -c "ALTER SYSTEM SET $setting"
          done
          psql "$PG_URL" -c "SELECT pg_reload_conf()"
          sleep 1
          test "$(psql "$PG_URL" -Atc "SHOW fsync")" = off
        env:
          PG_URL: postgres://finance:finance@localhost:5432/finance_test?sslmode=disable
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      # Next's build cache (.next/cache). The e2e web server builds the
      # standalone app on every run, so a warm cache speeds up the build. The
      # restore key falls back to the same lockfile with other sources.
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-build-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/messages/**', 'apps/web/next.config.ts', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/postcss.config.mjs') }}
          restore-keys: |
            next-build-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
      # The runner image already has Chrome's system libraries; --with-deps
      # only added fonts through an apt mirror that can stall for minutes.
      # Tests run headless, which only needs the headless shell.
      - run: pnpm exec playwright install --only-shell chromium
        working-directory: apps/web
        timeout-minutes: 5
      - name: End-to-end tests
        run: pnpm e2e --shard=${{ matrix.shard }}/2
        working-directory: apps/web
        env:
          CI: "true"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        if: needs.changes.outputs.api == 'true'
        run: docker build -t finance-wingman-api ./apps/api
      - name: Build web image
        if: needs.changes.outputs.web == 'true'
        run: docker build -t finance-wingman-web ./apps/web

  # Single check for branch protection: require `ci-ok` instead of the
  # individual jobs. Skipped jobs (path filter, push to main) count as
  # passing; a failed or cancelled job, including any e2e shard, fails it.
  ci-ok:
    if: always()
    needs: [changes, api, web, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job finished as '$result'"; exit 1 ;;
            esac
          done
