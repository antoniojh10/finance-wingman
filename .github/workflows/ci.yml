name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs skip change detection and run every job.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

jobs:
  # Detects which apps changed so unaffected jobs are skipped. A change to
  # this workflow counts as a change to every app.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api:
              - .github/workflows/ci.yml
              - apps/api/**
            web:
              - .github/workflows/ci.yml
              - apps/web/**

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DATABASE_URL: postgres://finance:finance@localhost:5432/finance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -count=1 ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Flows span both apps, so e2e runs when either changed, once the jobs
  # that did run have passed (a skipped api or web job does not block it).
  e2e:
    runs-on: ubuntu-latest
    needs: [changes, api, web]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: apps/web
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        if: needs.changes.outputs.api == 'true'
        run: docker build -t finance-wingman-api ./apps/api
      - name: Build web image
        if: needs.changes.outputs.web == 'true'
        run: docker build -t finance-wingman-web ./apps/web
